<title>Entrenador PAES M2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: hoja de respuestas. Papel gris frío, grafito, burbujas como opciones, tinta azul para lo que se hace, rojo de corrección para lo que falla y una regla (cinta de medir) como marca. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#171C20; --ink2:#566168; --line:#DCE1E5;
  --accent:#2A47C9; --accent-ink:#FFFFFF; --accent-soft:#E5EAFC;
  --hero-bg:#1E36A6; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.74);
  --ok:#17744A; --ok-bg:#DFF1E7; --bad:#B3342A; --bad-bg:#F8E4E1; --warn:#8A5A00; --warn-bg:#F6EBD2;
  --shadow:0 1px 2px rgba(23,28,32,.05),0 10px 26px -14px rgba(23,28,32,.22);
  --tabbg:rgba(255,255,255,.9);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1114; --surface:#161B1F; --surface2:#1B2126; --ink:#E8ECEE; --ink2:#9CA7AE; --line:#29313A;
  --accent:#96AAFF; --accent-ink:#0B1230; --accent-soft:#1D2750;
  --hero-bg:#22338F; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.72);
  --ok:#5ED19A; --ok-bg:#12301F; --bad:#FF9185; --bad-bg:#3A1B18; --warn:#EBC066; --warn-bg:#3A2D10;
  --shadow:0 0 0 rgba(0,0,0,0); --tabbg:rgba(22,27,31,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1114; --surface:#161B1F; --surface2:#1B2126; --ink:#E8ECEE; --ink2:#9CA7AE; --line:#29313A;
  --accent:#96AAFF; --accent-ink:#0B1230; --accent-soft:#1D2750;
  --hero-bg:#22338F; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.72);
  --ok:#5ED19A; --ok-bg:#12301F; --bad:#FF9185; --bad-bg:#3A1B18; --warn:#EBC066; --warn-bg:#3A2D10;
  --shadow:0 0 0 rgba(0,0,0,0); --tabbg:rgba(22,27,31,.9); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:600;letter-spacing:-.02em}
h2{font-size:1.1875rem;font-weight:600;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .small{font-size:.8125rem}
.lbl{font:500 .6875rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.brand{font:600 1rem var(--sans);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--hero-bg);display:grid;place-items:center;color:#fff;font:500 .6875rem var(--mono);font-style:normal}
.sync{font:500 .6875rem var(--mono);color:var(--ink2);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;min-height:32px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink2)} .sync.nube .dot{background:var(--ok)} .sync.warn .dot{background:var(--warn)} .sync.mal .dot{background:var(--bad)}

main{display:flex;flex-direction:column;gap:14px;padding-block:10px 18px}
main.conbar{padding-bottom:84px}
@media (prefers-reduced-motion:no-preference){
  main.anim>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  main.anim>*:nth-child(2){animation-delay:.04s} main.anim>*:nth-child(3){animation-delay:.08s} main.anim>*:nth-child(4){animation-delay:.12s}
  main.anim>*:nth-child(n+5){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .btn,.opt,.bar>i,.mod,.tile{transition:background .15s,border-color .15s,width .35s,transform .12s}
  .paso{animation:rise .3s ease both}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.875rem;border-radius:12px}
.btn.block{width:100%}
.btn:active,.mod:active,.tile:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:.8125rem;background:var(--surface)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:20px 20px 34px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.hero .lbl{color:var(--hero-dim)}
.hero .big{font:500 4.5rem/1 var(--mono);letter-spacing:-.06em;display:flex;align-items:baseline;gap:8px}
.hero .big span{font:500 1.125rem var(--sans);letter-spacing:0;color:var(--hero-dim)}
.hero .dim{color:var(--hero-dim);font-size:.9375rem}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.hstats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hstats b{font:500 1.375rem var(--mono)} .hstats .lbl{font-size:.625rem}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 8px) bottom/100% 6px no-repeat,
             repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 1.5px,transparent 1.5px 40px) bottom/100% 13px no-repeat}
.count{display:flex;align-items:baseline;gap:10px}
.count .n{font:500 3rem/1 var(--mono);letter-spacing:-.04em;color:var(--accent)} .count .u{font-size:1rem;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.bad>i{background:var(--bad)} .bar.ok>i{background:var(--ok)}
.lv{display:flex;gap:6px}
.lv button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:.875rem}
.lv button.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tema{display:flex;flex-direction:column;gap:10px}
.tema .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tema .code{font:500 .75rem var(--mono);color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-height:104px;justify-content:space-between}
.tile b{font-size:1.0625rem;font-weight:600;line-height:1.2} .tile span{font-size:.8125rem;color:var(--ink2)}
.tile.pri{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:92px}
.tile.pri span{color:var(--accent-ink);opacity:.82}

.sesion-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pips{display:flex;gap:5px;flex:1;justify-content:center}
.pips i{width:100%;max-width:28px;height:6px;border-radius:3px;background:var(--line)}
.pips i.ok{background:var(--ok)} .pips i.bad{background:var(--bad)} .pips i.now{background:var(--accent)}
.enun{font-size:1.125rem;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;min-height:60px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow-wrap:anywhere;font-size:1.0625rem}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:500 .875rem var(--mono);color:var(--ink2)}
.opt .t{min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.letters .opt{justify-content:center;padding:10px 0;min-height:60px}
.letters .opt .bub{width:36px;height:36px}
.fb{border-radius:16px;padding:14px 16px;font-size:.9375rem;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)} .fb.neu{background:var(--accent-soft);color:var(--ink)}
.fb .why{color:var(--ink)}
.sol{border-left:3px solid var(--accent);padding:2px 0 2px 14px;font-size:.9375rem;overflow-wrap:anywhere}

.guia h2{margin:6px 0 4px} .guia h3{margin:18px 0 6px} .guia h4{margin:14px 0 4px}
.guia p,.guia ul,.guia ol,.guia blockquote,.guia .tw{margin:8px 0}
.guia ul,.guia ol{padding-left:22px} .guia li{margin:3px 0}
.guia blockquote{border-left:3px solid var(--accent);padding:4px 12px;background:var(--accent-soft);border-radius:0 12px 12px 0}
.guia code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.guia hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.tw{overflow-x:auto;max-width:100%}
.tw table{border-collapse:collapse;font-size:.875rem;min-width:100%}
.tw th,.tw td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tw th{background:var(--accent-soft);white-space:nowrap}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;border-radius:0;min-height:56px}
.item:last-child{border-bottom:0}

/* aprendizaje */
.lec-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--line);cursor:pointer}
.segs i.done{background:var(--accent)} .segs i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step h2{font-size:1.375rem}
.kv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv-row{display:grid;grid-template-columns:minmax(92px,33%) 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9375rem}
.kv-row:nth-child(even){background:var(--surface2)} .kv-row:last-child{border-bottom:0}
.kv-row b{color:var(--accent);font-weight:600}
.problema{background:var(--accent-soft);border-radius:16px;padding:14px 16px;font-size:1.0625rem;overflow-wrap:anywhere}
.paso{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:6px 0;align-items:start}
.paso .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:500 .8125rem var(--mono)}
.paso p{padding-top:3px;overflow-wrap:anywhere}
.res{background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:14px 16px;font-weight:600}
.flipc{perspective:900px;width:100%;background:none;border:0;padding:0;text-align:left;display:block}
.flipc .in{display:grid;transition:transform .5s;transform-style:preserve-3d}
.flipc.on .in{transform:rotateY(180deg)}
.flipc .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.flipc .front{background:var(--bad-bg)} .flipc .front .lbl{color:var(--bad)}
.flipc .back{background:var(--ok-bg);transform:rotateY(180deg)} .flipc .back .lbl{color:var(--ok)}
.flipc.big .face{min-height:260px;justify-content:center;align-items:center;text-align:center;padding:24px}
.flipc.big .front{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)} .flipc.big .front .lbl{color:var(--ink2)}
.fq{font-size:1.3125rem;line-height:1.35;font-weight:500}
@media (prefers-reduced-motion:reduce){.flipc .in{transition:none}}
.mod{display:grid;grid-template-columns:46px 1fr;gap:4px 14px;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.mod .num{grid-row:1/4;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 .9375rem var(--mono)}
.mod.hecho .num{background:var(--ok-bg);color:var(--ok)}
.mod b{font-size:1.0625rem;font-weight:600;line-height:1.25} .mod .rs{font-size:.8125rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--ink2)}
.mod .meta .bar{flex:1;min-width:48px}

.er{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.er .n{flex:none;width:34px;font:500 .8125rem var(--mono);color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.seg button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:500 .875rem var(--mono)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:72px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;font:500 .875rem var(--mono);letter-spacing:.04em;resize:vertical}
.fixbar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:4}
.fixbar .wrap{display:flex;gap:10px;align-items:center}
.fixbar .btn{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:4px 2px;color:var(--ink2);font-size:.6875rem;font-weight:500;min-height:54px}
.tabs .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:600} .tabs button.on .ic{background:var(--accent-soft)}
.tabs .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font:500 .625rem var(--mono);padding:1px 6px}
.err{color:var(--bad)}
.crono{font:500 1.25rem var(--mono);color:var(--accent)} .crono.low{color:var(--bad)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink2);font:500 10px var(--mono)} .chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{fill:var(--accent);stroke:var(--surface);stroke-width:2} .chart .bar1{fill:var(--accent)}
.chart .meta{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4} .chart .hit{fill:transparent;cursor:pointer}
#tip{position:fixed;z-index:20;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font:500 .75rem var(--mono);pointer-events:none;max-width:70vw}
details.tabla{margin-top:4px} details.tabla summary{cursor:pointer;color:var(--accent);font-size:.875rem;min-height:36px;display:flex;align-items:center}
details.meta summary{list-style:none;cursor:pointer} details.meta summary::-webkit-details-marker{display:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:500 .8125rem var(--mono)}
.sw button.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ln1{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.875rem}
</style>

<div class="wrap">
  <div class="top"><div class="brand"><i>M2</i>Entrenador PAES</div><button class="sync" id="sync" data-act="sync-ahora" aria-label="Estado de guardado"><span class="dot"></span><span id="synctxt">cargando…</span></button></div>
  <main id="main"><div class="card"><p class="muted">Cargando tus datos…</p></div></main>
</div>
<div id="tip" hidden></div>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-act="tab" data-v="hoy"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Hoy</button>
  <button data-act="tab" data-v="practicar"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg></span>Practicar</button>
  <button data-act="tab" data-v="repaso"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg></span>Repaso<span class="badge" id="badge" hidden></span></button>
  <button data-act="tab" data-v="progreso"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Progreso</button>
  <button data-act="tab" data-v="guias"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6M9 12h4"/></svg></span>Aprende</button>
</nav>

<script>
(function(){
'use strict';
const KEY='paesm2-estado-v1';
const $=(s,e=document)=>e.querySelector(s);

const ACT={errores:e=>e.intentos||0,temas:e=>e.intentos||0,sub:e=>e.i||0,cartas:e=>e.intentos||0,formulas:e=>(e.o||0)+(e.k||0)};

    if(!x||!y){r.guias[k]=x||y;return}r.guias[k]={h:!!(x.h||y.h),max:Math.max(x.max||0,y.max||0),p:(x.v||0)>=(y.v||0)?x.p:y.p,v:Math.max(x.v||0,y.v||0)}});

  const seen={};r.ensayos=[];a.ensayos.concat(b.ensayos).forEach(e=>{const k=[e.prueba,e.fecha,e.correctas,e.puntuables].join('|');if(!seen[k]){seen[k]=1;r.ensayos.push(e)}});

  return normaliza(r);
}

async function sincroniza(){
  if(!dbDoc||!nubeLista)return;

  enCurso=true;pend=false;pintaSync('guardando');
  try{
    const snap=await conTiempo(dbDoc.get(),12000);

    if(snap.exists){const c=snap.data();if(c&&c.estado)remoto=normaliza(c.estado)}
    else if(snap.metadata&&snap.metadata.fromCache)throw new Error('sin confirmar');
    if(remoto){riquezaNube=riqueza(remoto);aplicar(mergeEstados(S,remoto))}
    if(riquezaNube>=8&&riqueza(S)<riquezaNube*.7){pintaSync('proteccion');enCurso=false;return}     // salvaguarda: nunca escribir algo mucho más pobre que lo que hay en la nube

async function conectarNube(){
  pintaSync('conectando');
  for(let i=0;i<6&&!nubeLista;i++){
    try{
      if(!window.claude||!window.claude.use){pintaSync('local');return}
      const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
      if(!user||!db){pintaSync('local');return}
      const uid=await user.id();if(!uid){pintaSync('local');return}
      const ref=db.doc('data/users/'+uid+'/progreso');
      const snap=await conTiempo(ref.get(),10000);
      if(!snap.exists&&snap.metadata&&snap.metadata.fromCache)throw new Error('sin confirmar');

function elegirEj(t,sb,nivel){
  let pool=[];
  if(sb){pool=POOLSUB[t+'|'+sb+'|'+nivel]||[];if(!pool.length)pool=POOLSUB[t+'|'+sb]||[]}
  if(!pool.length){pool=POOL[t+'|'+nivel]||[];if(!pool.length)pool=POOL[t+'|1']||POOL[t+'|2']||POOL[t+'|3']||[]}
  const libres=pool.filter(e=>!sesion.usados.has(e)),lista=libres.length?libres:pool;
  const e=lista[Math.floor(Math.random()*lista.length)];sesion.usados.add(e);return e;
}
function prepara(it){if(it.k==='gen'&&!it.ej)it.ej=elegirEj(it.t,it.s,it.lv||tEst(it.t).nivel)}
function iniciarSes(items,titulo,modo){
  if(!items.length){alert_('No hay nada disponible por ahora.');return}
  clearInterval(timer);
  sesion={items,n:items.length,titulo,i:0,ok:0,hist:[],resp:null,sel:null,conf:null,ent:null,info:'',usados:new Set(),fin:false,subio:false,refs:new Set(),modo:modo||'',resps:{},ents:{}};
  if(modo==='prueba'){items.forEach(prepara);sesion.t0=Date.now();sesion.limite=items.length*150000;arrancaCrono()}else prepara(items[0]);
  render();
}
function arrancaCrono(){
  clearInterval(timer);
  timer=setInterval(()=>{if(!sesion||sesion.modo!=='prueba'||sesion.fin){clearInterval(timer);return}
    const r=sesion.limite-(Date.now()-sesion.t0),el=$('#crono');if(el){el.textContent=fmtT(r);el.classList.toggle('low',r<60000)}if(r<=0)finPrueba()},500);
}
function itemsPrueba(n){
  const pr=prioridades().filter(x=>x.gen),items=[],cuenta={};
  while(items.length<n){
    const tot=pr.reduce((a,x)=>a+x.juego+.3,0);let r=Math.random()*tot,el=pr[0];
    for(const x of pr){r-=x.juego+.3;if(r<=0){el=x;break}}
    if((cuenta[el.t]||0)>=2&&pr.length>2)continue;
    cuenta[el.t]=(cuenta[el.t]||0)+1;items.push({k:'gen',t:el.t,lv:Math.max(2,tEst(el.t).nivel)});
  }
  return intercalar(items);
}
function finPrueba(){
  const s=sesion;if(!s||s.fin)return;clearInterval(timer);
  let ok=0;
  s.items.forEach((it,i)=>{
    const e=it.ej,r=s.resps[i],resp=r!==undefined,acierto=resp&&r===e.c;if(acierto)ok++;
    if(resp){registrarPractica(e.t,acierto);regSub(e.t,e.s,acierto)}
    s.ents[i]=logResp(2,e.t,e.s,acierto,null,resp?null:4);
    if(!acierto)abrirCarta(e.t,e.s,e.n,false);
  });
  s.ok=ok;s.usado=Date.now()-s.t0;s.fin=true;save();render();
}
function cerrarSes(){clearInterval(timer);sesion=null;ens=null;render()}
function alert_(m){const d=document.createElement('div');d.className='fb neu';d.textContent=m;$('#main').prepend(d);setTimeout(()=>d.remove(),2600)}
const itemsGen=(temas,n,lv)=>Array.from({length:n},(_,k)=>({k:'gen',t:temas[k%temas.length],lv:lv||0}));
function itemsSub(k,n){const [t,sb]=k.split('|');return Array.from({length:n},()=>({k:'gen',t,s:sb,lv:0}))}
function itemsCartas(max){return cartasPend().slice(0,max||99).map(k=>({k:'gen',t:S.cartas[k].t,s:S.cartas[k].s,lv:S.cartas[k].nivel,carta:k}))}
function gemelaOf(q,usados){
  let c=D.banco.filter(x=>x.t===q.t&&x.i!==q.i&&!x.el&&x.k&&!S.errores[x.i]&&!usados.has(x.i)&&(q.s==='general'||x.s===q.s));
  if(!c.length)c=D.banco.filter(x=>x.t===q.t&&x.i!==q.i&&!x.el&&x.k&&!S.errores[x.i]&&!usados.has(x.i));
  c=mezclar(c).sort((a,b)=>(S.oficiales[a.i]?1:0)-(S.oficiales[b.i]?1:0));
  return c.length?c[0].i:null;
}
function variante(id,usados){
  const q=BQ[id],modo=S.ajustes.repaso||'gen';
  if(modo==='misma')return {k:'of',id};
  if(modo==='gemela'){const g=gemelaOf(q,usados);if(g){usados.add(g);return {k:'of',id:g,orig:id}}}
  const sb=POOLSUB[q.t+'|'+q.s]?q.s:undefined;
  if(sb||POOL[q.t+'|2']||POOL[q.t+'|1'])return {k:'gen',t:q.t,s:sb,lv:Math.max(2,tEst(q.t).nivel),orig:id};
  return {k:'of',id};
}
function itemsRepaso(){
  const usados=new Set(),of=pendientes().map(id=>variante(id,usados)),ca=itemsCartas(),out=[],m=Math.max(of.length,ca.length);
  for(let i=0;i<m;i++){if(i<ca.length)out.push(ca[i]);if(i<of.length)out.push(of[i])}return intercalar(out);
}
function itemsRefuerzo(n){
  const items=itemsCartas(4),deb=debiles().filter(x=>x.gen).slice(0,4);let j=0;
  while(items.length<n&&deb.length){const x=deb[j%deb.length];items.push({k:'gen',t:x.t,s:x.s,lv:0});j++}
  if(!items.length){const pr=prioridades().filter(x=>x.gen).slice(0,3).map(x=>x.t);return itemsGen(pr,n,0)}
  return intercalar(items);
}

const mezclar=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=x[i];x[i]=x[j];x[j]=t}return x};

function ofLista(filtro,n,enOrden){
  n=n||10;

  const grupos={};base.forEach(q=>(grupos[q.p]=grupos[q.p]||[]).push(q));
  Object.keys(grupos).forEach(p=>{grupos[p]=(enOrden?grupos[p].sort((a,b)=>a.n-b.n):mezclar(grupos[p])).sort((a,b)=>rangoOf(a)-rangoOf(b))});
  const pruebas=mezclar(D.orden.filter(p=>grupos[p])),out=[];
  while(out.length<n&&pruebas.some(p=>grupos[p].length)){pruebas.forEach(p=>{if(out.length<n&&grupos[p].length)out.push(grupos[p].shift())})}

}

function svgLinea(pts,meta){

function svgBarras(pts){

function calcularEns(){
  const qs=D.banco.filter(q=>q.p===ens.prueba);
  const pun=qs.filter(q=>!q.pl&&!q.el&&q.k);
  const resp=ens.resp,resPun=pun.filter(q=>resp[q.n]).length;
  const completo=D.pruebas[ens.prueba].tipo==='completa'&&resPun>=0.8*pun.length;
  let c=0,pu=0,an=0,ac=0;const por={},fal=[];
  qs.forEach(q=>{if(q.el||!q.k)return;const m=resp[q.n];const ok=m===q.k;
    if(!q.pl){ if(completo||m){pu++;if(ok)c++;const t=por[q.t]||(por[q.t]=[0,0]);t[1]++;if(ok)t[0]++} }
    if(m&&!q.pl){an++;if(ok)ac++}
    if(m&&!ok)fal.push({q,m});});
  if(an){const dd=S.dias[hoy()]||(S.dias[hoy()]=[0,0]);dd[0]+=an;dd[1]+=ac}
  const puntaje=completo&&pu>=49?D.tabla[ens.prueba][String(c)]:null;
  fal.forEach(f=>agregarError(f.q.i,'ensayo '+ens.prueba));
  S.ensayos.push({prueba:ens.prueba,fecha:hoy(),correctas:c,puntuables:pu,puntaje,por_tema:por,parcial:!completo,resp:Object.assign({},resp)});

}

function irA(v){clearInterval(timer);vista=v;sesion=null;ens=null;guia=null;lec=null;fc=null;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);render()}

document.addEventListener('click',ev=>{
  const tp=ev.target.closest('[data-tip]'),tip=$('#tip');
  if(tp){const r=tp.getBoundingClientRect();tip.textContent=tp.dataset.tip;tip.hidden=false;tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';return}
  tip.hidden=true;
  const t=ev.target.closest('[data-act]');if(!t||!D)return;const d=t.dataset;
  switch(d.act){
    case 'tab':irA(d.v);break;
    case 'gen':iniciarSes(itemsGen(d.t.split(','),+d.n||6,d.lv?+d.lv:0),'Ejercicios');break;
    case 'refuerzo':iniciarSes(itemsRefuerzo(9),'Refuerzo de puntos débiles');break;
    case 'sub':reforzarSub(d.k);break;
    case 'repaso-ini':iniciarSes(itemsRepaso(),'Repaso');break;
    case 'of-tema':ofTema(d.t);break;
    case 'otra':{const t=sesion.titulo;if(sesion.modo==='prueba')iniciarSes(itemsPrueba(sesion.n),'Mini-ensayo','prueba');else if(t.startsWith('Refuerzo de'))iniciarSes(itemsRefuerzo(9),t);else if(sesion.items.every(x=>x.k==='gen'))iniciarSes(sesion.items.map(x=>({k:'gen',t:x.t,s:x.s,lv:x.lv})),t);else render();break}
    case 'salir':cerrarSes();break;
    case 'resp':{const s=sesion;if(!s||s.resp!==null)break;const i=+d.i;if(S.ajustes.conf){s.sel=i;render(true)}else finalizar(i,null);break}
    case 'resp-of':{const s=sesion;if(!s||s.resp!==null)break;if(S.ajustes.conf){s.sel=d.l;render(true)}else finalizar(d.l,null);break}
    case 'conf':{const s=sesion;if(!s||s.resp!==null||s.sel===null)break;finalizar(s.sel,+d.c);break}
    case 'causa':{const s=sesion,ent=d.i!==undefined?s.ents[+d.i]:s.ent;if(ent){ent[6]=ent[6]===+d.c?-1:+d.c;save();const y=window.scrollY;render(true);window.scrollTo(0,y)}break}
    case 'orig':{const s=sesion,it=s&&s.items[s.i];if(it&&it.orig&&s.resp===null){s.items[s.i]={k:'of',id:it.orig};s.sel=null;render(true)}break}
    case 'of-prueba':ofPrueba(d.p);break;
    case 'rep-modo':S.ajustes.repaso=d.m;S.ajustes.u=Date.now();save();render(true);break;
    case 'sig':{const s=sesion;s.i++;if(s.i>=s.n)s.fin=true;else{s.resp=null;s.sel=null;s.conf=null;s.ent=null;s.info='';s.subio=false;prepara(s.items[s.i])}render();break}
    case 'prueba-ini':iniciarSes(itemsPrueba(+d.n||10),'Mini-ensayo','prueba');break;

    case 'prueba-skip':{const s=sesion;if(!s||s.fin)break;s.i++;if(s.i>=s.n)finPrueba();else render();break}
    case 'prueba-fin':finPrueba();break;
    case 'ptab':progTab=d.p;render(true);break;
    case 'meta':S.ajustes.meta=+d.m;S.ajustes.u=Date.now();save();render(true);break;
    case 'conf-toggle':S.ajustes.conf=!S.ajustes.conf;S.ajustes.u=Date.now();save();render(true);break;
    case 'ens-ini':iniciarEns();break;
    case 'ens-pr':ens.prueba=d.p;ens.resp={};render();break;
    case 'ens-atras':ens.prueba=null;render();break;
    case 'ens-m':{const n=+d.n;if(ens.resp[n]===d.l)delete ens.resp[n];else ens.resp[n]=d.l;
      const y=window.scrollY;render(true);window.scrollTo(0,y);break}
    case 'ens-pega':{
      const txt=(($('#pega')||{}).value||'').toUpperCase().replace(/[^A-E\-.]/g,'');const nums=numerosPrueba(ens.prueba);
      const orden=(txt.length===55&&D.pruebas[ens.prueba].tipo==='completa')?Array.from({length:55},(_,k)=>k+1):nums;
      ens.resp={};[...txt].forEach((c,k)=>{if('ABCDE'.includes(c)&&orden[k]&&nums.includes(orden[k]))ens.resp[orden[k]]=c});
      const y=window.scrollY;render(true);window.scrollTo(0,y);break}
    case 'ens-calc':calcularEns();break;
    case 'guia':guia=d.g;vista='guias';lec=null;fc=null;render();break;
    case 'guia-atras':guia=null;render();break;
    case 'guia-mod':{const m=D.modulos.find(x=>x.temas.includes(d.t));if(m)abrirLec(m.guia);break}
    case 'lec':abrirLec(d.g);break;
    case 'lec-salir':lec=null;render();break;
    case 'lec-next':lecIr(lec.i+1);break;
    case 'lec-prev':lecIr(lec.i-1);break;
    case 'lec-ir':lecIr(+d.k);break;
    case 'lec-rev':{lec.rev++;const y=window.scrollY;render(true);window.scrollTo(0,y);break}
    case 'lec-flip':{const k=+d.k;if(lec.flip.has(k))lec.flip.delete(k);else lec.flip.add(k);const y=window.scrollY;render(true);window.scrollTo(0,y);break}
    case 'lec-otro':{const p=pasosDe(lec.g)[lec.i];nuevoMini(p);render(true);break}
    case 'lec-resp':{const mn=lec&&lec.mini;if(!mn||mn.resp!==null)break;const e=mn.ej,i=+d.i,ok=i===e.c;mn.resp=i;
      registrarPractica(e.t,ok);regSub(e.t,e.s,ok);logResp(0,e.t,e.s,ok,null);if(!ok)abrirCarta(e.t,e.s,e.n,false);save();const y=window.scrollY;render(true);window.scrollTo(0,y);break}
    case 'fc-ini':iniciarFc();break;
    case 'fc-salir':fc=null;render();break;
    case 'fc-flip':fc.flip=!fc.flip;render(true);break;
    case 'fc-ok':case 'fc-ko':{const id=fc.ids[fc.i],f=S.formulas[id]||(S.formulas[id]={o:0,k:0,t:0}),ok=d.act==='fc-ok';
      if(ok){f.o++;fc.ok++}else{f.k++;fc.ko++;fc.mal.push(id)}f.t=Date.now();save();fc.i++;fc.flip=false;if(fc.i>=fc.ids.length)fc.fin=true;render();break}
    case 'bk-copy':{const txt=JSON.stringify(S);bk={txt,msg:'Copiado. Pégalo en un lugar seguro (notas o correo).'};
      try{navigator.clipboard.writeText(txt).then(()=>{},()=>{bk.msg='No pude copiar solo: selecciona y copia el texto.'})}catch(e){bk.msg='Selecciona y copia el texto.'}render(true);break}
    case 'bk-open':bk={restore:true};render(true);break;
    case 'bk-restore':{try{const o=JSON.parse(($('#bktxt')||{}).value||'');if(!o||typeof o!=='object'||!Array.isArray(o.ensayos)||typeof o.errores!=='object')throw new Error('x');
        bk={restore:true,pend:o,msg:`Se reemplazará tu progreso por: ${Object.keys(o.errores).length} errores, ${(o.hist||[]).length} respuestas y ${o.ensayos.length} ensayo(s).`}}catch(e){bk={restore:true,msg:'Ese texto no parece un respaldo válido.'}}render(true);break}
    case 'bk-confirm':{if(bk&&bk.pend){S=mergeEstados(S,normaliza(bk.pend));save();bk=null;render()}break}
    case 'sync-ahora':{if(dbDoc&&nubeLista){clearTimeout(tmr);sincroniza()}else conectarNube();break}
    case 'resp-ver':verRespaldos();break
    case 'resp-rest':{const it=respList&&respList.lista[+d.i];if(it){S=mergeEstados(S,normaliza(clon(it.estado)));save();respMsg='Recuperado: se combinó ese respaldo con tu progreso actual.';render(true)}break}
    case 'bk-cancel':bk=null;render(true);break
  }
});

/* ───────── arranque ───────── */
async function cargar(){
  try{
    const [d,e,g,lc]=await Promise.all(['datos.json','ejercicios.json','guias.json','lecciones.json'].map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
    D=d;GUIAS=g;L=lc;e.forEach(x=>{(POOL[x.t+'|'+x.n]=POOL[x.t+'|'+x.n]||[]).push(x)});
    D.banco.forEach(q=>BQ[q.i]=q);
    e.forEach(x=>{const a=x.t+'|'+x.s;(POOLSUB[a]=POOLSUB[a]||[]).push(x);(POOLSUB[a+'|'+x.n]=POOLSUB[a+'|'+x.n]||[]).push(x)});
    const local=leerLocal();S=local||estadoInicial();pintaSync('conectando');
    cargaOk=true;
    const nube=conectarNube();
    if(!local){$('#main').innerHTML='<div class="card"><p class="muted">Recuperando tu progreso…</p></div>';await Promise.race([nube,esperar(5000)])}
    render();
  }catch(err){
    $('#main').innerHTML=`<div class="card"><h2 class="err">No se pudieron cargar los datos</h2><p class="muted">Revisa tu conexión e inténtalo de nuevo.</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div>`;
  }
}
let respList=null,respMsg='';
async function verRespaldos(){
  if(!dbDoc){respMsg='Solo disponible con tu cuenta conectada.';render(true);return}
  try{const q=await conTiempo(dbDoc.collection('respaldos').get(),10000);
    respList={lista:q.docs.map(x=>{const d=x.data()||{};return {id:x.id,r:d.r||0,ts:d.ts||0,estado:d.estado}}).filter(x=>x.estado).sort((a,b)=>b.r-a.r||b.ts-a.ts)};respMsg=''}catch(e){respMsg='No pude leer los respaldos ahora.'}render(true);
}
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(!lec||sesion||ens||e.target.closest('.tw,textarea,.chart'))return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>80&&Math.abs(dy)<45){if(dx<0&&lec.i<pasosDe(lec.g).length-1)lecIr(lec.i+1);else if(dx>0&&lec.i>0)lecIr(lec.i-1)}
},{passive:true});
window.__paes={merge:mergeEstados,riqueza:riqueza,estado:()=>S,sync:()=>estadoSync};   // gancho para pruebas
cargar();
})();
</script>
